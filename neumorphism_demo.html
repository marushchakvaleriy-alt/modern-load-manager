<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Demo - ViYar Load Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #e0e5ec;
            font-family: 'Outfit', sans-serif;
            color: #4a5568;
        }

        .neu-flat {
            background-color: #e0e5ec;
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), 
                       -9px -9px 16px rgba(255,255,255, 0.5);
            border-radius: 20px;
        }

        .neu-pressed {
            background-color: #e0e5ec;
            box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7),
                        inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
            border-radius: 20px;
        }

        .neu-btn {
            background-color: #e0e5ec;
            box-shadow: 6px 6px 10px rgba(163,177,198,0.6), 
                       -6px -6px 10px rgba(255,255,255, 0.5);
            border-radius: 16px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        
        .neu-btn:active {
            box-shadow: inset 4px 4px 8px rgba(163,177,198, 0.7),
                        inset -4px -4px 8px rgba(255,255,255, 0.8);
        }

        .neu-menu-active {
            box-shadow: inset 4px 4px 8px rgba(163,177,198, 0.7),
                        inset -4px -4px 8px rgba(255,255,255, 0.8);
            color: #3d5afe;
        }
        
        .text-primary { color: #3d5afe; }
    </style>
</head>
<body class="min-h-screen flex p-8 gap-8 box-border">
    <aside class="neu-flat w-72 p-8 flex flex-col gap-8">
        <div class="flex items-center gap-4 mb-4">
            <div class="neu-flat p-4 rounded-full text-primary flex items-center justify-center">
                <i data-lucide="layers" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-700">Load<br>Manager</h1>
        </div>

        <nav class="flex flex-col gap-5">
            <div class="neu-menu-active p-4 rounded-2xl flex items-center gap-4 font-bold cursor-pointer">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span>Дашборд</span>
            </div>
            <div class="neu-btn p-4 flex items-center gap-4 font-semibold hover:text-primary">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span>Працівники</span>
            </div>
            <div class="neu-btn p-4 flex items-center gap-4 font-semibold hover:text-primary">
                <i data-lucide="briefcase" class="w-5 h-5"></i>
                <span>Проекти</span>
            </div>
            <div class="neu-btn p-4 flex items-center gap-4 font-semibold hover:text-primary">
                <i data-lucide="settings" class="w-5 h-5"></i>
                <span>Налаштування</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col gap-8">
        <header class="neu-flat px-8 py-5 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-700">Огляд завантаженості</h2>
            <div class="flex items-center gap-6">
                <div class="neu-pressed px-5 py-3 flex items-center gap-3 text-sm rounded-full">
                    <i data-lucide="search" class="w-4 h-4 text-gray-500"></i>
                    <input type="text" placeholder="Пошук..." class="bg-transparent outline-none w-56 text-gray-700 placeholder-gray-500">
                </div>
                <div class="neu-btn p-3 rounded-full flex items-center justify-center">
                    <i data-lucide="bell" class="w-5 h-5 text-gray-600"></i>
                </div>
                <div class="neu-flat w-12 h-12 rounded-full overflow-hidden border-2 border-transparent p-1">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="w-full h-full object-cover rounded-full">
                </div>
            </div>
        </header>

        <div class="grid grid-cols-3 gap-8">
            <div class="neu-flat p-8 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 font-bold uppercase tracking-wider text-sm">Всього проектів</span>
                    <div class="neu-btn p-3 text-primary rounded-xl"><i data-lucide="folder" class="w-5 h-5"></i></div>
                </div>
                <div class="text-5xl font-bold text-gray-700">142</div>
                <div class="text-sm text-green-600 font-bold">+12% за місяць</div>
            </div>
            <div class="neu-flat p-8 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 font-bold uppercase tracking-wider text-sm">Активні завдання</span>
                    <div class="neu-btn p-3 text-orange-500 rounded-xl"><i data-lucide="activity" class="w-5 h-5"></i></div>
                </div>
                <div class="text-5xl font-bold text-gray-700">48</div>
                <div class="text-sm text-gray-500 font-bold">В процесі виконання</div>
            </div>
            <div class="neu-flat p-8 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 font-bold uppercase tracking-wider text-sm">Завершені</span>
                    <div class="neu-btn p-3 text-green-500 rounded-xl"><i data-lucide="check-circle" class="w-5 h-5"></i></div>
                </div>
                <div class="text-5xl font-bold text-gray-700">94</div>
                <div class="text-sm text-green-600 font-bold">+5 нових сьогодні</div>
            </div>
        </div>

        <div class="neu-flat flex-1 p-8 flex flex-col gap-8">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-700">Графік завантаженості (Демо)</h3>
                <div class="flex gap-4">
                    <button class="neu-pressed px-6 py-2 rounded-xl text-primary font-bold">Тиждень</button>
                    <button class="neu-btn px-6 py-2 rounded-xl font-bold text-gray-500">Місяць</button>
                </div>
            </div>
            <div class="flex-1 neu-pressed rounded-3xl p-8 flex items-end justify-between gap-6 relative">
                <div class="w-full bg-[#3d5afe] rounded-xl opacity-60 shadow-lg" style="height: 40%"></div>
                <div class="w-full bg-[#3d5afe] rounded-xl opacity-80 shadow-lg" style="height: 70%"></div>
                <div class="w-full bg-[#3d5afe] rounded-xl shadow-[0_0_15px_rgba(61,90,254,0.5)] relative" style="height: 100%">
                    <div class="absolute -top-10 left-1/2 -translate-x-1/2 neu-flat px-3 py-1 text-xs font-bold text-gray-700">Макс</div>
                </div>
                <div class="w-full bg-[#3d5afe] rounded-xl opacity-70 shadow-lg" style="height: 60%"></div>
                <div class="w-full bg-[#3d5afe] rounded-xl opacity-90 shadow-lg" style="height: 80%"></div>
                <div class="w-full bg-[#3d5afe] rounded-xl opacity-50 shadow-lg" style="height: 30%"></div>
                <div class="w-full bg-[#3d5afe] rounded-xl opacity-70 shadow-lg" style="height: 50%"></div>
            </div>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
